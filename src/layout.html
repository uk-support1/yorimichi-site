<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<meta name="description" content="@@DESC@@">
@@ROBOTS@@
<meta name="theme-color" content="#2f6b5e">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:site_name" content="{{fullName}}">
<meta property="og:title" content="@@TITLE@@">
<meta property="og:description" content="@@DESC@@">
<meta name="twitter:card" content="summary">
@@CANONICAL@@
<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{base}}assets/style.css">
<script>document.documentElement.classList.add('js');try{var s=localStorage.getItem('ym-size');if(s)document.documentElement.dataset.size=s}catch(e){}</script>
@@LD@@
</head>
<body class="@@BODYCLASS@@">
<a class="skip" href="#main">本文へ移動</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{base}}" aria-label="{{fullName}} ホーム">
      <svg class="brand-mark" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#2f6b5e"/><path d="M6 25c6 0 5-9 11-9s5-6 11-6" fill="none" stroke="#fbf8f2" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 4.6"/><circle cx="26.5" cy="10" r="2.6" fill="#f2b45b"/></svg>
      <span class="brand-text"><span class="brand-name">よりみち</span><span class="brand-sub">就労移行支援事業所</span></span>
    </a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="gnav">メニュー</button>
    <nav id="gnav" class="gnav" aria-label="メインメニュー">
      <ul>@@NAV@@</ul>
    </nav>
  </div>
</header>
@@CRUMB@@
<main id="main" tabindex="-1">
@@MAIN@@
</main>
<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <p class="footer-brand">{{fullName}}</p>
      <p class="footer-status">{{status}}</p>
      <p class="footer-note">所在地・開所日などは決まり次第掲載します。掲載している制度の情報は{{lastChecked}}時点の公的情報をもとにしています。</p>
    </div>
    <nav aria-label="フッターメニュー">
      <ul class="footer-links">
        <li><a href="{{base}}about/">考え方</a></li>
        <li><a href="{{base}}system/">制度と利用の流れ</a></li>
        <li><a href="{{base}}faq/">よくある質問</a></li>
        <li><a href="{{base}}news/">お知らせ</a></li>
        <li><a href="{{base}}contact/">お問い合わせ</a></li>
        <li><a href="{{base}}privacy/">プライバシーポリシー</a></li>
        <li><a href="{{base}}accessibility/">アクセシビリティ</a></li>
      </ul>
      <div class="size-ctl" role="group" aria-label="文字の大きさ">
        <span>文字の大きさ</span>
        <button type="button" data-size="m" aria-pressed="true">標準</button>
        <button type="button" data-size="l" aria-pressed="false">大きめ</button>
      </div>
    </nav>
  </div>
  <p class="copy wrap">&copy; {{name}}(開設準備中)</p>
</footer>
<script src="{{base}}assets/main.js" defer></script>
</body>
</html>
